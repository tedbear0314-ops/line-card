<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TED 專業控制台 | 祝福圖庫版</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; background: #f4f7f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { color: #2c3e50; font-size: 1.2rem; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .section-title { font-size: 0.9rem; color: #7f8c8d; margin: 20px 0 10px; font-weight: bold; }
        
        /* 圖片選擇區樣式 */
        .gallery { display: grid; grid-template-columns: repeat(2, 1-fr); gap: 10px; margin-bottom: 20px; }
        .img-option { border: 3px solid transparent; border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.2s; position: relative; }
        .img-option.selected { border-color: #ff7675; }
        .img-option img { width: 100%; height: 100px; object-fit: cover; display: block; }
        .img-option::after { content: "✓"; position: absolute; top: 5px; right: 5px; background: #ff7675; color: white; width: 20px; height: 20px; border-radius: 50%; display: none; text-align: center; line-height: 20px; font-size: 12px; }
        .img-option.selected::after { display: block; }

        button { width: 100%; padding: 15px; font-size: 1rem; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-main { background: #06C755; box-shadow: 0 4px 12px rgba(6,199,85,0.3); }
        .btn-festive { background: #ff7675; box-shadow: 0 4px 12px rgba(255,118,117,0.3); }
        button:active { transform: scale(0.98); }
        .footer { text-align: center; margin-top: 20px; font-size: 0.7rem; color: #bdc3c7; }
    </style>
</head>
<body>

<div class="container">
    <h2>TED 行動工作站</h2>
    
    <div class="section-title">1. 發送身分卡片</div>
    <button class="btn-main" onclick="sendCard()">📤 發送雙專業名片</button>

    <div class="section-title">2. 挑選祝福圖片並發送</div>
    <div class="gallery" id="gallery">
        <div class="img-option selected" onclick="selectImg(this, 'https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=800', '溫馨花語')">
            <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=300">
        </div>
        <div class="img-option" onclick="selectImg(this, 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800', '節慶派對')">
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300">
        </div>
        <div class="img-option" onclick="selectImg(this, 'https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=800', '晨曦能量')">
            <img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=300">
        </div>
        <div class="img-option" onclick="selectImg(this, 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800', '海闊天空')">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300">
        </div>
    </div>
    
    <button class="btn-festive" onclick="sendSelectedFestive()">🌸 發送選中圖片</button>

    <div class="footer">
        已連結 LIFF ID: 2010086405-5iXoP1OW<br>
        選擇圖片後點擊按鈕即可無痕發送
    </div>
</div>

<script>
    let selectedImgUrl = 'https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=800';
    let selectedTitle = '溫馨花語';

    async function init() {
        try {
            await liff.init({ liffId: "2010086405-5iXoP1OW" });
            if (!liff.isLoggedIn()) { liff.login(); }
        } catch (e) { console.error(e); }
    }

    function selectImg(el, url, title) {
        document.querySelectorAll('.img-option').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedImgUrl = url;
        selectedTitle = title;
    }

    async function share(payload, altText) {
        if (!liff.isLoggedIn()) { liff.login(); return; }
        try {
            const result = await liff.shareTargetPicker([{"type": "flex", "altText": altText, "contents": payload}]);
            if (result) { console.log("Success"); }
        } catch (e) { console.error(e); }
    }

    // 發送名片邏輯 (保持不變)
    function sendCard() {
        const payload = {
          "type": "carousel",
          "contents": [
            { "type": "bubble", "hero": { "type": "image", "url": "https://images.unsplash.com/photo-1556742049-13ff7337990c?w=800", "size": "full", "aspectRatio": "20:13", "aspectMode": "cover" }, "body": { "type": "box", "layout": "vertical", "contents": [ { "type": "text", "text": "TED 劉人豪", "weight": "bold", "size": "xl" }, { "type": "text", "text": "專業保險顧問", "size": "md", "color": "#06C755", "weight": "bold" }, { "type": "text", "text": "為您建立最穩固的財務防火牆。", "size": "sm", "color": "#666666", "wrap": true } ] }, "footer": { "type": "box", "layout": "vertical", "contents": [ { "type": "button", "style": "primary", "color": "#06C755", "action": { "type": "uri", "label": "加 LINE 諮詢", "uri": "https://line.me/ti/p/~" } } ] } },
            { "type": "bubble", "hero": { "type": "image", "url": "https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=800", "size": "full", "aspectRatio": "20:13", "aspectMode": "cover" }, "body": { "type": "box", "layout": "vertical", "contents": [ { "type": "text", "text": "TED 劉人豪", "weight": "bold", "size": "xl" }, { "type": "text", "text": "環保工程師", "size": "md", "color": "#4169E1", "weight": "bold" }, { "type": "text", "text": "專精空污防制與排放計算技術。", "size": "sm", "color": "#666666", "wrap": true } ] }, "footer": { "type": "box", "layout": "vertical", "contents": [ { "type": "button", "style": "primary", "color": "#4169E1", "action": { "type": "uri", "label": "專案需求討論", "uri": "https://line.me/ti/p/~" } } ] } }
          ]
        };
        share(payload, "TED 向您遞交了數位專業名片");
    }

    // 發送選中的祝福圖
    function sendSelectedFestive() {
        const payload = {
          "type": "bubble",
          "hero": { "type": "image", "url": selectedImgUrl, "size": "full", "aspectRatio": "1:1", "aspectMode": "cover" },
          "body": { "type": "box", "layout": "vertical", "contents": [
              { "type": "text", "text": "來自 TED 的祝福", "weight": "bold", "size": "lg", "color": "#ff7675" },
              { "type": "text", "text": "希望這份小驚喜能帶給您好心情，祝您事事順心！", "size": "md", "color": "#666666", "margin": "md", "wrap": true }
          ]},
          "footer": { "type": "box", "layout": "vertical", "contents": [
              { "type": "text", "text": "— 專業顧問 TED 關心您 —", "align": "center", "color": "#aaaaaa", "size": "xs" }
          ]}
        };
        share(payload, "TED 傳送了一個溫馨祝福給您");
    }

    init();
</script>

</body>
</html>
