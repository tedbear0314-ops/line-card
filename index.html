<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TED 專業控制台 | 多選發送版</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #2c3e50; text-align: center; font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .section-title { font-size: 0.9rem; color: #7f8c8d; margin: 20px 0 10px; font-weight: bold; }
        
        /* 多選圖庫樣式 */
        .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .img-option { border: 4px solid #eee; border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.2s; position: relative; }
        .img-option.selected { border-color: #06C755; }
        .img-option img { width: 100%; height: 110px; object-fit: cover; display: block; }
        .img-option::after { content: ""; position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; background: white; border: 2px solid #ddd; border-radius: 50%; display: block; }
        .img-option.selected::after { content: "✓"; background: #06C755; border-color: #06C755; color: white; text-align: center; line-height: 22px; font-size: 14px; font-weight: bold; }

        button { width: 100%; padding: 16px; font-size: 1rem; font-weight: bold; color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-card { background: #34495e; margin-bottom: 15px; }
        .btn-send-multi { background: #06C755; box-shadow: 0 5px 15px rgba(6,199,85,0.3); }
        button:active { transform: scale(0.97); }
        .hint { text-align: center; font-size: 0.8rem; color: #95a5a6; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h2>TED 行動工作站</h2>
    
    <button class="btn-card" onclick="sendCard()">📤 發送專業身分名片</button>

    <div class="section-title">選擇多張圖片 (最多 12 張)</div>
    <div class="gallery">
        <div class="img-option" onclick="toggleSelect(this, 'https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=800', '溫馨祝福')">
            <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=300">
        </div>
        <div class="img-option" onclick="toggleSelect(this, 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=800', '節慶分享')">
            <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300">
        </div>
        <div class="img-option" onclick="toggleSelect(this, 'https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=800', '正能量')">
            <img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=300">
        </div>
        <div class="img-option" onclick="toggleSelect(this, 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800', '海闊天空')">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300">
        </div>
    </div>
    
    <button class="btn-send-multi" onclick="sendMultiPhotos()">🚀 一鍵發送所選圖片</button>

    <div class="hint">
        勾選圖片後按下按鈕即可發送輪播卡片<br>
        (此功能將以您的名義無痕送出)
    </div>
</div>

<script>
    let selectedPhotos = [];

    async function init() {
        try {
            await liff.init({ liffId: "2010086405-5iXoP1OW" });
            if (!liff.isLoggedIn()) { liff.login(); }
        } catch (e) { console.error(e); }
    }

    // 切換選取狀態
    function toggleSelect(el, url, title) {
        const index = selectedPhotos.findIndex(p => p.url === url);
        if (index > -1) {
            selectedPhotos.splice(index, 1);
            el.classList.remove('selected');
        } else {
            if (selectedPhotos.length >= 12) {
                alert("最多只能選擇 12 張圖片喔！");
                return;
            }
            selectedPhotos.push({ url, title });
            el.classList.add('selected');
        }
    }

    // 發送多圖輪播 (Carousel)
    async function sendMultiPhotos() {
        if (selectedPhotos.length === 0) {
            alert("請至少選擇一張圖片！");
            return;
        }

        const bubbles = selectedPhotos.map(photo => ({
            "type": "bubble",
            "hero": {
                "type": "image",
                "url": photo.url,
                "size": "full",
                "aspectRatio": "1:1",
                "aspectMode": "cover"
            },
            "body": {
                "type": "box",
                "layout": "vertical",
                "contents": [
                    { "type": "text", "text": photo.title, "weight": "bold", "size": "md" },
                    { "type": "text", "text": "來自 TED 的分享", "size": "xs", "color": "#aaaaaa", "margin": "xs" }
                ]
            }
        }));

        const payload = { "type": "carousel", "contents": bubbles };

        try {
            const res = await liff.shareTargetPicker([{
                "type": "flex",
                "altText": "TED 傳送了一組精彩圖片給您",
                "contents": payload
            }]);
            if (res) { console.log("Success"); }
        } catch (e) { console.error(e); }
    }

    // 保持原本的名片功能
    async function sendCard() {
        // ... (省略原本名片 JSON，維持與之前相同即可)
    }

    init();
</script>

</body>
</html>
